slam_toolbox:
  ros__parameters:
    use_sim_time: true

    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 8.0

    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0

    scan_queue_size: 1
    transform_timeout: 0.2